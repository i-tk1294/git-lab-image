name: build-svn-bundle-el9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget

      - name: Download SVN and dependencies (AlmaLinux 9)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/Packages
          APPSTREAM=https://repo.almalinux.org/almalinux/9/AppStream/x86_64/os/Packages

          # SVN
          wget $APPSTREAM/s/subversion-1.14.2-7.el9.x86_64.rpm
          wget $APPSTREAM/s/subversion-libs-1.14.2-7.el9.x86_64.rpm

          # Dependencies
          wget $BASEOS/a/apr-1.7.0-12.el9.x86_64.rpm
          wget $BASEOS/a/apr-util-1.6.1-20.el9.x86_64.rpm
          wget $BASEOS/s/sqlite-libs-3.34.1-6.el9.x86_64.rpm
          wget $APPSTREAM/s/serf-1.3.9-16.el9.x86_64.rpm
          wget $BASEOS/u/utf8proc-2.6.1-3.el9.x86_64.rpm
          wget $BASEOS/l/libzstd-1.5.2-7.el9.x86_64.rpm
          wget $BASEOS/l/liblz4-1.9.3-5.el9.x86_64.rpm

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            echo "Extracting $f"
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_el9.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-el9
          path: svn_bundle_el9.zip
