name: build-svn-from-source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libapr1-dev \
            libaprutil1-dev \
            libsqlite3-dev \
            libserf-dev \
            liblz4-dev \
            libzstd-dev \
            libutf8proc-dev \
            wget \
            unzip

      - name: Download Subversion source
        run: |
          wget https://downloads.apache.org/subversion/subversion-1.14.3.tar.gz
          tar xf subversion-1.14.3.tar.gz

      - name: Build Subversion
        run: |
          cd subversion-1.14.3
          ./configure --prefix=/opt/svn --without-gnome-keyring --without-kwallet
          make -j$(nproc)
          make install

      - name: Package SVN bundle
        run: |
          cd /opt
          zip -r svn_bundle_source.zip svn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-source
          path: /opt/svn_bundle_source.zip
