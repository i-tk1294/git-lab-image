name: build-svn-bundle-rel10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget curl

      - name: Download SVN and dependencies (Rocky Linux 10)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://download.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/Packages
          APPSTREAM=https://download.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/Packages

          # Function to fetch latest RPM by pattern
          fetch_latest() {
            local url=$1
            local pattern=$2
            local rpm=$(curl -s $url/ | grep -oP "$pattern" | sort -V | tail -1)
            echo "Downloading: $rpm"
            wget "$url/$rpm"
          }

          # SVN
          fetch_latest $APPSTREAM "subversion-[0-9].*\.rpm"
          fetch_latest $APPSTREAM "subversion-libs-[0-9].*\.rpm"

          # Dependencies
          fetch_latest $BASEOS "apr-[0-9].*\.rpm"
          fetch_latest $BASEOS "apr-util-[0-9].*\.rpm"
          fetch_latest $BASEOS "sqlite-libs-[0-9].*\.rpm"
          fetch_latest $APPSTREAM "serf-[0-9].*\.rpm"
          fetch_latest $BASEOS "utf8proc-[0-9].*\.rpm"
          fetch_latest $BASEOS "libzstd-[0-9].*\.rpm"
          fetch_latest $BASEOS "liblz4-[0-9].*\.rpm"

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_rel10.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-rel10
          path: svn_bundle_rel10.zip
