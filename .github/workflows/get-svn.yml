name: build-svn-bundle-rel9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget curl gzip xmlstarlet

      - name: Download SVN and dependencies (Rocky Linux 9)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://ftp.riken.jp/Linux/rocky/9/BaseOS/x86_64/os
          APPSTREAM=https://ftp.riken.jp/Linux/rocky/9/AppStream/x86_64/os

          fetch_from_repo() {
            local repo_url=$1
            local pkg_pattern=$2

            echo "Fetching metadata from $repo_url"

            curl -s $repo_url/repodata/repomd.xml -o repomd.xml

            primary=$(xmlstarlet sel -t -v "//data[@type='primary']/location/@href" repomd.xml)
            echo "Primary metadata: $primary"

            curl -s $repo_url/$primary -o primary.xml.gz
            gunzip -f primary.xml.gz

