name: build-svn-bundle-rel10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget

      - name: Download SVN and dependencies (Rocky Linux 10)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://download.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/Packages
          APPSTREAM=https://download.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/Packages

          wget $APPSTREAM/s/subversion-*.rpm
          wget $APPSTREAM/s/subversion-libs-*.rpm
          wget $BASEOS/a/apr-*.rpm
          wget $BASEOS/a/apr-util-*.rpm
          wget $BASEOS/s/sqlite-libs-*.rpm
          wget $APPSTREAM/s/serf-*.rpm
          wget $BASEOS/u/utf8proc-*.rpm
          wget $BASEOS/l/libzstd-*.rpm
          wget $BASEOS/l/liblz4-*.rpm

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_rel10.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-rel10
          path: svn_bundle_rel10.zip
