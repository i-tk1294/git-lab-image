name: build-svn-bundle-rel9

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget curl gzip xmlstarlet

      - name: Download SVN and dependencies (Rocky Linux 9)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://mirror.sfo12.us.leaseweb.net/rocky/9/BaseOS/x86_64/os
          APPSTREAM=https://mirror.sfo12.us.leaseweb.net/rocky/9/AppStream/x86_64/os

          echo "=== Fetching primary metadata ==="

          # --- AppStream primary.xml ---
          curl -s $APPSTREAM/repodata/repomd.xml -o repomd-app.xml
          primary_app=$(xmlstarlet sel --nonet --dropdtd -t -v "//data[@type='primary']/location/@href" repomd-app.xml)
          curl -s $APPSTREAM/$primary_app -o primary-app.xml.gz
          gunzip -f primary-app.xml.gz
          xmlstarlet ed --dropdtd primary-app.xml > primary-app-clean.xml
          mv primary-app-clean.xml primary-app.xml

          # --- BaseOS primary.xml ---
          curl -s $BASEOS/repodata/repomd.xml -o repomd-base.xml
          primary_base=$(xmlstarlet sel --nonet --dropdtd -t -v "//data[@type='primary']/location/@href" repomd-base.xml)
          curl -s $BASEOS/$primary_base -o primary-base.xml.gz
          gunzip -f primary-base.xml.gz
          xmlstarlet ed --dropdtd primary-base.xml > primary-base-clean.xml
          mv primary-base-clean.xml primary-base.xml

          echo "=== Extracting RPM URLs ==="

          get_rpm() {
            xml=$1
            pattern=$2
            repo=$3

            rpm=$(xmlstarlet sel --nonet --dropdtd \
                  -t -m "//package[name[contains(., '$pattern')]]" \
                  -v "location/@href" -n "$xml" \
                  | sort -V | tail -1)

            if [ -z "$rpm" ]; then
              echo "ERROR: pattern '$pattern' not found in $xml"
              exit 1
            fi

            echo "Downloading: $rpm"
            wget "$repo/$rpm"
          }

          # SVN
          get_rpm primary-app.xml "subversion-" $APPSTREAM
          get_rpm primary-app.xml "subversion-libs-" $APPSTREAM

          # Dependencies
          get_rpm primary-base.xml "apr-" $BASEOS
          get_rpm primary-base.xml "apr-util-" $BASEOS
          get_rpm primary-base.xml "sqlite-libs-" $BASEOS
          get_rpm primary-app.xml "serf-" $APPSTREAM
          get_rpm primary-base.xml "utf8proc-" $BASEOS
          get_rpm primary-base.xml "libzstd-" $BASEOS
          get_rpm primary-base.xml "liblz4-" $BASEOS

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            echo "Extracting $f"
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_rel9.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-rel9
          path: svn_bundle_rel9.zip
