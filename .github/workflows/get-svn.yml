name: build-svn-bundle-el8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget

      - name: Download SVN and dependencies (Oracle Linux 8)
        run: |
          mkdir rpms
          cd rpms

          # SVN
          wget https://yum.oracle.com/repo/OracleLinux/OL8/appstream/x86_64/getPackage/subversion-1.10.2-5.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/appstream/x86_64/getPackage/subversion-libs-1.10.2-5.el8.x86_64.rpm

          # Dependencies
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/apr-1.6.3-12.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/apr-util-1.6.1-6.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/sqlite-libs-3.26.0-15.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/appstream/x86_64/getPackage/serf-1.3.9-10.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/utf8proc-2.1.1-4.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/libzstd-1.4.4-1.el8.x86_64.rpm
          wget https://yum.oracle.com/repo/OracleLinux/OL8/baseos/latest/x86_64/getPackage/liblz4-1.8.3-3.el8.x86_64.rpm

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            echo "Extracting $f"
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_el8.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-el8
          path: svn_bundle_el8.zip
