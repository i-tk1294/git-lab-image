name: build-svn-bundle-rel10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio wget curl

      - name: Download SVN and dependencies (Rocky Linux 10)
        run: |
          mkdir rpms
          cd rpms

          BASEOS=https://download.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/Packages
          APPSTREAM=https://download.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/Packages

          # href="" の中だけを抽出する関数
          fetch_rpm() {
            local base_url=$1
            local pattern=$2

            for letter in {a..z}; do
              url="$base_url/$letter"
              echo "Checking $url ..."

              # href="xxxx.rpm" の中身だけを抜き出す
              rpm=$(curl -s "$url/" \
                | grep -oP 'href="\K[^"]+\.rpm' \
                | grep -E "$pattern" \
                | sort -V \
                | tail -1)

              if [ -n "$rpm" ]; then
                echo "Found: $rpm"
                wget "$url/$rpm"
                return
              fi
            done

            echo "ERROR: $pattern not found in $base_url"
            exit 1
          }

          # SVN
          fetch_rpm $APPSTREAM "subversion-[0-9]"
          fetch_rpm $APPSTREAM "subversion-libs-[0-9]"

          # Dependencies
          fetch_rpm $BASEOS "apr-[0-9]"
          fetch_rpm $BASEOS "apr-util-[0-9]"
          fetch_rpm $BASEOS "sqlite-libs-[0-9]"
          fetch_rpm $APPSTREAM "serf-[0-9]"
          fetch_rpm $BASEOS "utf8proc-[0-9]"
          fetch_rpm $BASEOS "libzstd-[0-9]"
          fetch_rpm $BASEOS "liblz4-[0-9]"

      - name: Extract RPMs
        run: |
          mkdir -p svn_bundle
          for f in rpms/*.rpm; do
            echo "Extracting $f"
            rpm2cpio "$f" | cpio -idmv -D svn_bundle
          done

      - name: Zip bundle
        run: |
          cd svn_bundle
          zip -r ../svn_bundle_rel10.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svn-bundle-rel10
          path: svn_bundle_rel10.zip
