name: Get Sonar Plugin

on:
  workflow_dispatch:

jobs:
  get-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Prepare dependencies (offline)
        run: |
          echo "Current directory:"
          pwd
          echo "Listing files:"
          ls -la
          mvn -B dependency:go-offline
          mvn -B -DskipTests verify

      - name: Archive Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository
