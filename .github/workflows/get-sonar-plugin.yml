name: Get Sonar Plugin

on:
  workflow_dispatch:

jobs:
  get-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Move to project root (pom.xml のある場所に変更)
        run: |
          echo "Current directory:"
          pwd
          echo "Searching for pom.xml..."
          find . -name pom.xml

      - name: Prepare dependencies (offline)
        run: |
          mvn -B -Dmaven.repo.local=./maven-repo dependency:go-offline
          mvn -B -Dmaven.repo.local=./maven-repo -DskipTests verify

      - name: Archive Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: maven-repo
